# DeskCap拼音 — single schema, full luna dictionary, 简体默认
# encoding: utf-8

config_version: "0.5"

schema_list:
  - schema: deskcap_pinyin

menu:
  # 0.6.62 — 9 → 5：与 macOS 系统拼音默认一致。9 个带英文释义的 chip
  # 总宽约 1500pt，会占满整屏并把候选框 x 坐标钉死在屏幕左边（看起来「不跟随」）。
  page_size: 5

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch
