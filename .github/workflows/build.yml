name: build

# 统一构建：三端编译 + 打包 + 产出可下载安装包。
#
# 平台范围：**macOS + Windows**（Linux 暂不适配）。
#
# 任何一次 push / PR：
#   1. 验证 DeskCap 在 macOS / Windows 能编译并打包
#   2. 验证 macOS 输入法 DeskCapIME 能编译出 .app
#   3. **上传安装包为 workflow artifact**（仓库已开源，公开仓库的 artifact 免费）
#
# 打 tag（v*）时：自动创建 GitHub Release，把三端安装包作为附件发布。
#
# 签名说明：CI 默认 ad-hoc 签名（无证书），产物可自用与验证，但分发给他人时
# 首次打开需右键「打开」。要产出 Developer ID 签名 + 公证的包，在仓库
# Settings → Secrets 配置下面四项后重跑，workflow 会自动走签名 + 公证路径：
#   APPLE_CERTIFICATE_P12       (base64 的 .p12)
#   APPLE_CERTIFICATE_PASSWORD  (.p12 密码)
#   APPLE_ID                    (Apple ID)
#   APPLE_TEAM_ID               (Team ID)
#   APPLE_APP_PASSWORD          (App 专用密码)
# 未配置时签名步骤整体跳过，不影响构建。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  deskcap:
    name: DeskCap · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (dmg)
            bundles: dmg
            artifact: DeskCap-macOS
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: Windows (nsis)
            bundles: nsis
            artifact: DeskCap-Windows
            path: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}-release

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      # ── macOS：有证书就 Developer ID 签名，没有就 ad-hoc ──
      - name: Import Apple certificate (macOS, optional)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "未配置 APPLE_CERTIFICATE_P12 —— 跳过证书导入，使用 ad-hoc 签名"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/cert.p12

      # 签名身份必须在 build 之前定好：无证书用 ad-hoc（"-"），
      # 有证书才用 "Developer ID Application"。secrets 不能出现在 if: 里，
      # 所以写进 GITHUB_ENV 让后续 step 继承。
      - name: Pick signing identity (macOS)
        if: matrix.os == 'macos-latest'
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          if [ -z "$HAS_CERT" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "无证书 → ad-hoc 签名"
          else
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
            echo "有证书 → Developer ID 签名"
          fi

      - name: Build bundle (${{ matrix.bundles }})
        # 注意：这里**不要**传 APPLE_ID / APPLE_TEAM_ID / APPLE_PASSWORD。
        # Tauri 只要看到这些变量存在（哪怕是空字符串）就会尝试公证，
        # 没有 Team ID 直接失败：`failed to notarize app: Team ID must be ...`。
        # 需要签名/公证时由 Notarize step 单独处理，build 只用
        # GITHUB_ENV 里的 APPLE_SIGNING_IDENTITY（无证书为 "-"，即 ad-hoc）。
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Notarize (macOS, optional)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_ID" ]; then
            echo "未配置 Apple 凭据 —— 跳过公证（产物为 ad-hoc 签名）"
            exit 0
          fi
          # 注意：Tauri 打 `--bundles dmg` 后会把 bundle/macos/*.app 清掉，
          # 所以这里公证 **dmg 本身**（Apple 支持，也是标准做法）。
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "公证 dmg: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "公证 + stapling 完成"
          # 复核：dmg 里的 app 应是 Developer ID 签名
          codesign -dv --verbose=2 /Volumes/DeskCap*/DeskCap.app 2>/dev/null | grep Authority | head -2 || true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: warn
          retention-days: 30

  ime:
    name: DeskCapIME · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 输入法依赖 librime / leveldb / opencc 的头与动态库。
      # 三个都是 BSD-3 / Apache-2.0，未修改、动态链接（见 THIRD-PARTY-NOTICES.md）。
      - name: Homebrew deps
        run: brew install librime leveldb opencc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build DeskCapIME.app
        # 无证书时脚本自动回退 ad-hoc 签名（build-and-install.sh 的 sign_one）。
        # CI 不设 INSTALL_TO_SYSTEM，只构建不安装。
        run: bash macos-ime/scripts/build-and-install.sh

      - name: Verify bundle
        run: |
          APP="$GITHUB_WORKSPACE/macos-ime/.build-ime/DeskCapIME.app"
          test -x "$APP/Contents/MacOS/DeskCapIME" || (echo "missing binary"; exit 1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :InputMethodConnectionName' "$APP/Contents/Info.plist"
          # LGPL 数据必须随 app 分发且在 Resources 下（运行时加载，不静态嵌入）
          ls "$APP/Contents/Resources/rime-data/" | head -20
          test -f "$APP/Contents/Resources/rime-data/luna_pinyin.dict.yaml" \
            || (echo "LGPL dict missing"; exit 1)

      - name: Package IME
        run: |
          APP="$GITHUB_WORKSPACE/macos-ime/.build-ime/DeskCapIME.app"
          cd "$(dirname "$APP")"
          # ditto 保留符号链接与扩展属性，zip 便于跨平台分发
          ditto -c -k --keepParent DeskCapIME.app "$RUNNER_TEMP/DeskCapIME.zip"

      - name: Upload IME
        uses: actions/upload-artifact@v4
        with:
          name: DeskCapIME-macOS
          path: ${{ runner.temp }}/DeskCapIME.zip
          if-no-files-found: warn
          retention-days: 30

  # 打 tag（v*）时自动发 Release，把三端安装包挂上去
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deskcap, ime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/DeskCap-macOS/*.dmg
            dist/DeskCap-Windows/*.exe
            dist/DeskCapIME-macOS/*.zip
          body: |
            ## 安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS (Apple Silicon) | `DeskCap_*_aarch64.dmg` | 桌面端 |
            | macOS 输入法 | `DeskCapIME.zip` | 解压后放到 `/Library/Input Methods/`，或自行构建 |
            | Windows x64 | `DeskCap_*_x64-setup.exe` | 桌面端（仅采集，无输入法） |

            **签名状态**：默认 ad-hoc 签名（CI 无证书）。首次打开若被拦截，
            右键 → 打开，或在「系统设置 → 隐私与安全性」里允许。
            维护者配置 Apple 证书后可产出 Developer ID 签名 + 公证版本。

            **数据只存本地**：不上传云端，局域网 Agent 读取需 Bearer 令牌。
            详见 `SECURITY.md`。
